<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danyelle Melo | Projetos</title>

    <link rel="stylesheet" href="./styles/style.css">

    <link rel="icon" href="src/avatar_topo.png" type="image/x-icon">
</head>

<body>

    <header class="cabecalho">
        <div class="logo-container">
            <img class="logo logo-principal" src="src/logo.png" alt="Logo desenvolvedora" width="80" height="80" />
            <img class="logo logo-hover" src="src/logo_alternativa.png" alt="Logo alternativa" width="80" height="75.8" />
        </div>
        <nav class="cabecalho__menu">
            <a class="cabecalho__menu__link" href="index.html">Home</a>
            <a class="cabecalho__menu__link" href="sobre-mim.html">Sobre mim</a>
            <a class="cabecalho__menu__link" href="projetos.html">Projetos</a>
        </nav>
    </header>

    <main class="apresentacao">
        <section class="sobremim" id="projetos" style="margin: top 5px;">

            <div class="projects-section-div">

                <h2 class="h2" style="margin-top:100px; margin-right: 57%; margin-bottom:30px;">Projetos</h2>

                <div class="project-container">
                    <button class="scroll-button left-button">◀</button>

                    <div class="scrollable-projects">
                        <div class="project-boxes-div">
                            <div data-aos="fade-up" class="project-box-wrapper">
                                <div class="project-box project-box2" id="project-box2">
                                    <div class="info-div">

                                        <article class="ProjectHeading">BI</article>
                                        <p class="ProjectDescription">
                                            BI - Ouvidoria
                                        </p>
                                        <div class="project-buttons">
                                            <a href="src/pdf/bi_ouvidoria.pdf" target="_blank" class="cta" aria-label="Abrir resumo do projeto">
                                                <span>Detalhes do Projeto (PDF)</span> <svg viewBox="0 0 13 10" height="10px" width="15px">
                                                    <path d="M1,5 L11,5"></path>
                                                    <polyline points="8 1 12 5 8 9"></polyline>
                                                </svg>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="image-div">
                                        <img src="src/png/pag_principal.png" alt="BI Ouvidoria" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button class="scroll-button right-button">▶</button>

                </div>

            </div>

        </section>

    <script src="script.js" defer></script>
